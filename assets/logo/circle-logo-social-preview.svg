<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Circle Logo Social Preview</title>
  <desc id="desc">Circle 简洁版社交预览图：深海军蓝底，居中蓝至青渐变断环 + CIRCLE 字标。</desc>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- 深海军蓝底 -->
  <rect x="0" y="0" width="1280" height="640" fill="#0B1220"/>

  <!-- 居中 logo 内容（560x560 区域，等比放大 512 设计稿） -->
  <g transform="translate(640,320) scale(1.09375) translate(-256,-256)">
    <!-- 主渐变断环 -->
    <path d="M 350.000 158.208 A 108.544 108.544 0 1 1 256 103.936"
          fill="none" stroke="url(#ringGrad)" stroke-width="23.552" stroke-linecap="butt"/>
    <!-- 内侧细环 -->
    <path d="M 330.270 169.600 A 85.760 85.760 0 1 1 256 126.720"
          fill="none" stroke="#385C9E" stroke-width="4.608" stroke-linecap="butt"/>
    <!-- 节点圆点 -->
    <circle cx="310.272" cy="118.479" r="14.602" fill="#7DEBFC"/>
    <!-- CIRCLE 字标 -->
    <text x="256" y="396.8" text-anchor="middle"
          font-family="Ubuntu, 'DejaVu Sans', 'Liberation Sans', sans-serif"
          font-size="65.536" font-weight="700" letter-spacing="19.456" fill="#D6E2F4">CIRCLE</text>
  </g>
</svg>
